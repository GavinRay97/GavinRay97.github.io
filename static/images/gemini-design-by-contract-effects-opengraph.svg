<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 150) rotate(45) scale(400)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 480) rotate(0) scale(450)">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="480" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>

    <!-- Card Drop Shadow -->
    <filter id="shadow" x="-20" y="-20" width="520" height="480" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow Overlay Shapes -->
  <circle cx="200" cy="150" r="400" fill="url(#cyan-glow)"/>
  <circle cx="1000" cy="480" r="450" fill="url(#purple-glow)"/>

  <!-- LEFT COLUMN: Content & Typography -->
  <g transform="translate(80, 80)">
    
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="265" height="34" rx="17" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#38BDF8"/>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.2">SYSTEMS &amp; PL DESIGN</text>
    </g>

    <!-- Headline Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
      Why LLM-Generated Code
    </text>
    
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Needs Design-by-Contract
    </text>
    
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
      &amp; Effect Systems
    </text>

    <!-- Divider Bar -->
    <rect x="0" y="255" width="80" height="4" rx="2" fill="#38BDF8"/>

    <!-- Subtitle / Hook -->
    <text x="0" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" width="500">
      <tspan x="0" dy="0">As AI shifts software development from authoring</tspan>
      <tspan x="0" dy="28">to prompting, language-level verification features</tspan>
      <tspan x="0" dy="28">become 10x more valuable.</tspan>
    </text>

    <!-- Footer Meta/Tags -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="125" height="28" rx="6" fill="#1E293B"/>
      <text x="12" y="18" font-family="monospace" font-size="12" fill="#34D399" font-weight="600">requires</text>

      <rect x="135" y="0" width="110" height="28" rx="6" fill="#1E293B"/>
      <text x="147" y="18" font-family="monospace" font-size="12" fill="#38BDF8" font-weight="600">ensures</text>

      <rect x="255" y="0" width="105" height="28" rx="6" fill="#1E293B"/>
      <text x="267" y="18" font-family="monospace" font-size="12" fill="#C084FC" font-weight="600">effects</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Code Card Visual -->
  <g transform="translate(660, 80)" filter="url(#shadow)">
    <!-- Glassmorphic Card Container -->
    <rect width="460" height="470" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>

    <!-- Card Window Controls -->
    <circle cx="28" cy="28" r="6" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="48" cy="28" r="6" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="68" cy="28" r="6" fill="#10B981" fill-opacity="0.8"/>
    <text x="360" y="32" font-family="monospace" font-size="12" fill="#64748B">contract.rs</text>
    
    <line x1="0" y1="52" x2="460" y2="52" stroke="#1E293B" stroke-width="1"/>

    <!-- Code Block -->
    <g transform="translate(28, 80)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" xml:space="preserve">
      <!-- Function Signature -->
      <text x="0" y="0">
        <tspan fill="#F43F5E">fn</tspan> <tspan fill="#60A5FA">change_email</tspan><tspan fill="#94A3B8">(</tspan>
      </text>
      <text x="16" y="22">
        <tspan fill="#F8FAFC">user</tspan><tspan fill="#94A3B8">: &amp;mut User,</tspan>
      </text>
      <text x="16" y="44">
        <tspan fill="#F8FAFC">new_email</tspan><tspan fill="#94A3B8">: String</tspan>
      </text>
      <text x="0" y="66"><tspan fill="#94A3B8">)</tspan></text>

      <!-- Precondition -->
      <text x="16" y="105">
        <tspan fill="#34D399" font-weight="bold">requires</tspan> <tspan fill="#F8FAFC">new_email.is_valid()</tspan>
      </text>

      <!-- Postconditions -->
      <text x="16" y="145">
        <tspan fill="#38BDF8" font-weight="bold">ensures</tspan> <tspan fill="#F8FAFC">user.email == new_email</tspan>
      </text>
      <text x="16" y="170">
        <tspan fill="#38BDF8" font-weight="bold">ensures</tspan> <tspan fill="#F8FAFC">user.verified == </tspan><tspan fill="#F43F5E">false</tspan>
      </text>

      <!-- Effects Block -->
      <text x="16" y="210">
        <tspan fill="#C084FC" font-weight="bold">effects</tspan> <tspan fill="#94A3B8">{</tspan>
      </text>
      <text x="32" y="235">
        <tspan fill="#F8FAFC">state.write(user.email),</tspan>
      </text>
      <text x="32" y="260">
        <tspan fill="#F8FAFC">alloc</tspan>
      </text>
      <text x="16" y="285">
        <tspan fill="#94A3B8">}</tspan>
      </text>

      <!-- Verified Badge Overlay -->
      <g transform="translate(190, 310)">
        <rect width="216" height="36" rx="8" fill="#065F46" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
        <path d="M16 18 L22 24 L32 12" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="40" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34D399" letter-spacing="0.5">VERIFIED CONTRACT</text>
      </g>
    </g>
  </g>
</svg>
